// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

function SDLCDiagram({ activePhase, onPhaseClick }) {
  // Manual SVG-friendly layout of the plan -> execute flow (both Spec-Kit)
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0, border: "1px solid var(--ink)", background: "var(--bg-card)" }}>

        side="left"
        tag="Phase A — Spec-Kit planning"
        title="What to build"
        nodes={COOKBOOK.specKit.map((s, i) => ({ n: String(i + 1).padStart(2, "0"), label: s.label, cmd: s.cmd, role: s.role }))}
        active={activePhase}
        onClick={onPhaseClick}
        accent="var(--accent)"
        prefix="A"
      />
      {/* EXECUTION (right) */}
      <PhaseColumn
        side="right"
        tag="Phase B — Spec-Kit execution"
        title="How to build it"
        nodes={COOKBOOK.execution.map((s) => ({ n: s.n, label: s.label, cmd: s.skill, role: "Coder" }))}
        active={activePhase}
        onClick={onPhaseClick}
        accent="var(--green)"
        prefix="B"
      />
    </div>
  );
}

function PhaseColumn({ side, tag, title, nodes, active, onClick, accent, prefix }) {
  return (
    <div style={{ padding: "32px 36px", borderLeft: side === "right" ? "1px solid var(--rule)" : "none" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
        <div className="eyebrow" style={{ color: accent }}>{tag}</div>
        <div className="mono" style={{ fontSize: 10, color: "var(--muted)" }}>{nodes.length} steps</div>
      </div>
      <h3 className="display" style={{ fontSize: 36, margin: "0 0 24px", color: "var(--ink)" }}>{title}</h3>

      <ol style={{ listStyle: "none", padding: 0, margin: 0, display: "flex", flexDirection: "column", gap: 2 }}>
        {nodes.map((node, i) => {
          const id = `${prefix}${i}`;
          const isActive = active === id;
          return (
            <li key={id}>
              <button
                onClick={() => onClick(id)}
                style={{
                  width: "100%",
                  textAlign: "left",
                  display: "grid",
                  gridTemplateColumns: "44px 1fr auto",
                  alignItems: "center",
                  gap: 12,
                  padding: "12px 14px",
                  border: isActive ? `1px solid ${accent}` : "1px solid transparent",
                  background: isActive ? "var(--bg-soft)" : "transparent",
                  cursor: "pointer",
                  fontFamily: "inherit",
                  color: "var(--ink)",
                  transition: "all 0.15s ease",
                }}
                onMouseEnter={(e) => { if (!isActive) e.currentTarget.style.background = "var(--bg-soft)"; }}
                onMouseLeave={(e) => { if (!isActive) e.currentTarget.style.background = "transparent"; }}
              >
                <span className="mono" style={{ fontSize: 11, color: accent, fontWeight: 600 }}>{node.n}</span>
                <span style={{ fontSize: 16, fontWeight: 500 }}>{node.label}</span>

function WalkthroughSection({ workflow, setWorkflow }) {

        no="03"

function CopyButton({ text }) {
  const [copied, setCopied] = useState(false);
  return (
    <button

        navigator.clipboard.writeText(text).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 1600);

      }}
      style={{
        marginTop: 12,
        padding: "8px 14px",
        background: copied ? "var(--green)" : "transparent",

        fontFamily: "var(--ff-mono)",
        fontSize: 11,
        letterSpacing: "0.12em",
        textTransform: "uppercase",
        transition: "all 0.2s",

      {copied ? "✓ Copied" : "Copy handoff →"}
    </button>
  );
}

// ─────────────────────────────────────────────────────────────────────────

function TDDLoopSection() {
  const [phase, setPhase] = useState(0);
  const phases = [
    {
      name: "RED",
      sub: "Write the failing test",
      color: "var(--red)",
      detail: "Confirm it fails for the RIGHT reason. Wrong-reason failure = fix the test, not the code.",
      code: `// tests/expense-crud.test.ts
test('saves $10.50 as 1050 cents', async () => {
  const e = await saveExpense({
    amount: 10.50, category: 'Food', date: ...
  });
  expect(e.amount).toBe(1050); // ❌ FAIL
});`,
      log: "● expense-crud.test.ts\n  ✗ saves $10.50 as 1050 cents (4ms)\n  → ReferenceError: saveExpense is not defined",
    },
    {
      name: "GREEN",
      sub: "Minimum code to pass",
      color: "var(--green)",
      detail: "Write the MINIMUM. New abstraction not required? Delete it. New dep not in constitution? Ask.",
      code: `// src/lib/expenses.ts
export async function saveExpense(input) {
  return db.expense.create({
    data: { ...input, amount: Math.round(input.amount * 100) }
  });
}`,
      log: "● expense-crud.test.ts\n  ✓ saves $10.50 as 1050 cents (12ms)\n\nTests: 1 passed, 1 total",
    },
    {
      name: "REFACTOR",
      sub: "Clean up, stay green",
      color: "var(--gold)",
      detail: "Run tests after every change. Must stay green. Then proceed to two-stage review.",
      code: `// src/lib/expenses.ts
import { toCents } from './currency';

export async function saveExpense(input: ExpenseInput) {
  return db.expense.create({
    data: { ...input, amount: toCents(input.amount) }
  });
}`,
      log: "● All tests passing\n  ✓ saves $10.50 as 1050 cents (8ms)\n  ✓ toCents utility unit tests (3 passed)\n\n→ Spec compliance ✓ · Code quality ✓",
    },
  ];

  // auto cycle disabled — user controls
  const p = phases[phase];

  return (
    <section style={ckStyles.section}>
      <SectionHeader
        no="04"
        kicker="The Loop"

// ─────────────────────────────────────────────────────────────────────────
// SECTION VIII — The Flywheel
// ─────────────────────────────────────────────────────────────────────────

function FlywheelSection() {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick((t) => (t + 1) % COOKBOOK.flywheel.length), 1800);
    return () => clearInterval(id);
  }, []);

  const cx = 260, cy = 260, r = 170;
  const steps = COOKBOOK.flywheel;
  const colorMap = {
    ink: "var(--ink)",
    blue: "var(--blue)",
    green: "var(--green)",
    gold: "var(--gold)",
    red: "var(--red)",
  };

  return (
    <section style={ckStyles.section}>
      <SectionHeader
        no="08"
        kicker="The Flywheel"
        title={<>Failures are <em className="display-italic" style={{ color: "var(--accent)" }}>learning</em>, logged.</>}
        lede="The continuous improvement loop. Every session adds to the journal; every failure adds to the postmortem; every postmortem sharpens the next cycle's prompts."
      />

      <div style={{ display: "grid", gridTemplateColumns: "520px 1fr", gap: 32, alignItems: "start" }}>
        {/* Flywheel visualization */}
        <div style={{ background: "var(--bg-card)", border: "1px solid var(--ink)", padding: 24, aspectRatio: "1 / 1", position: "relative" }}>
          <svg viewBox="0 0 520 520" style={{ width: "100%", height: "100%", display: "block" }}>
            {/* Outer circle */}
            <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--rule)" strokeWidth="1" strokeDasharray="3 4" />
            <circle cx={cx} cy={cy} r={r + 30} fill="none" stroke="var(--rule)" strokeWidth="0.5" />

            {steps.map((s, i) => {
              const angle = (i / steps.length) * Math.PI * 2 - Math.PI / 2;
              const x = cx + Math.cos(angle) * r;
              const y = cy + Math.sin(angle) * r;
              const isActive = tick === i;

              // Arc to next
              const nextAngle = ((i + 1) / steps.length) * Math.PI * 2 - Math.PI / 2;
              const nx = cx + Math.cos(nextAngle) * r;
              const ny = cy + Math.sin(nextAngle) * r;

              return (
                <g key={i}>
                  <path
                    d={`M ${x} ${y} A ${r} ${r} 0 0 1 ${nx} ${ny}`}
                    fill="none"
                    stroke={isActive ? "var(--accent)" : "var(--rule)"}
                    strokeWidth={isActive ? "2.5" : "1"}
                    style={{ transition: "all 0.4s" }}
                  />
                  <circle cx={x} cy={y} r={isActive ? 18 : 14} fill={colorMap[s.color]} stroke="var(--bg)" strokeWidth="3" style={{ transition: "all 0.3s" }} />
                  <text x={x} y={y + 4} textAnchor="middle" fontSize="11" fontFamily="JetBrains Mono" fontWeight="600" fill="var(--bg)">
                    {String(i + 1).padStart(2, "0")}
                  </text>

                  {/* Label */}
                  <g transform={`translate(${cx + Math.cos(angle) * (r + 60)}, ${cy + Math.sin(angle) * (r + 60)})`}>
                    <text textAnchor="middle" fontSize="16" fontFamily="Instrument Serif" fill="var(--ink)" style={{ fontStyle: isActive ? "italic" : "normal" }}>
                      {s.step}
                    </text>
                  </g>
                </g>
              );
            })}

            {/* Center label */}
            <text x={cx} y={cy - 4} textAnchor="middle" fontSize="14" fontFamily="JetBrains Mono" fill="var(--muted)" letterSpacing="2">
              CYCLE
            </text>
            <text x={cx} y={cy + 22} textAnchor="middle" fontSize="32" fontFamily="Instrument Serif" fontStyle="italic" fill="var(--accent)">
              {String(tick + 1).padStart(2, "0")} / {String(steps.length).padStart(2, "0")}
            </text>
          </svg>
        </div>

        {/* Step ledger */}
        <div>
          <div className="eyebrow" style={{ marginBottom: 16 }}>The five files of the flywheel</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
            {steps.map((s, i) => {
              const isActive = tick === i;
              return (
                <div key={i} style={{
                  display: "grid",
                  gridTemplateColumns: "44px 1fr",
                  gap: 16,
                  padding: "18px 20px",
                  background: isActive ? "var(--bg-card)" : "transparent",
                  borderLeft: isActive ? `4px solid ${colorMap[s.color]}` : "4px solid transparent",
                  borderBottom: "1px solid var(--rule)",
                  transition: "all 0.3s",
                  alignItems: "center",
                }}>
                  <div style={{
                    width: 36, height: 36, borderRadius: "50%",
                    background: colorMap[s.color],
                    color: "var(--bg)",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    fontFamily: "var(--ff-mono)", fontSize: 12, fontWeight: 600,
                  }}>{String(i + 1).padStart(2, "0")}</div>
                  <div>
                    <div className="display" style={{ fontSize: 22, color: "var(--ink)", marginBottom: 2 }}>{s.step}</div>
                    <div className="mono" style={{ fontSize: 11.5, color: "var(--muted)" }}>{s.file}</div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Sample postmortem card */}
          <div style={{ marginTop: 24, border: "1px solid var(--ink)", background: "var(--ink)", color: "var(--bg)" }}>
            <div style={{ padding: "14px 20px", borderBottom: "1px solid var(--rule)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div className="mono" style={{ fontSize: 10, letterSpacing: "0.14em", color: "var(--accent)" }}>SAMPLE POSTMORTEM · LIVE</div>
              <Pill color="var(--gold)" border="var(--gold)">{COOKBOOK.postmortem.severity}</Pill>
            </div>
            <div style={{ padding: 20 }}>
              <div className="mono" style={{ fontSize: 11, color: "var(--muted)", marginBottom: 4 }}>
                [{COOKBOOK.postmortem.date}] {COOKBOOK.postmortem.slug}
              </div>
              <div className="display-italic" style={{ fontSize: 18, marginBottom: 12, color: "var(--bg)" }}>
                {COOKBOOK.postmortem.affected}
              </div>
              <p style={{ margin: "0 0 12px", fontSize: 12.5, lineHeight: 1.55, color: "var(--ink-2)" }}>
                <strong style={{ color: "var(--accent)" }}>What happened: </strong>{COOKBOOK.postmortem.what}
              </p>
              <p style={{ margin: "0 0 12px", fontSize: 12.5, lineHeight: 1.55, color: "var(--ink-2)" }}>
                <strong style={{ color: "var(--gold)" }}>Root cause: </strong>{COOKBOOK.postmortem.cause}
              </p>
              <p style={{ margin: "0 0 12px", fontSize: 12.5, lineHeight: 1.55, color: "var(--ink-2)" }}>
                <strong style={{ color: "var(--green)" }}>Guardrail: </strong>{COOKBOOK.postmortem.guardrail}
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 12 }}>
        {COOKBOOK.stack2026.map((s, i) => (
          <div
            key={s.layer}
            style={{
              display: "flex",
              flexDirection: "column",
              padding: "20px 22px 18px",
              background: "var(--bg-card)",

            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 14 }}>
              <Pill color="var(--ink)" border="var(--ink)">{s.scope}</Pill>
              <Pill color="var(--muted)" border="var(--rule)">{s.load}</Pill>
            </div>

            <p style={{ margin: "0 0 12px", fontSize: 13.5, lineHeight: 1.55, color: "var(--ink-2)" }}>
              {s.what}

              <div className="eyebrow" style={{ marginBottom: 6 }}>Why it matters</div>
              <p style={{ margin: 0, fontSize: 13, lineHeight: 1.55, color: "var(--ink)" }}>{s.why}</p>

// ─────────────────────────────────────────────────────────────────────────
// APP
// ─────────────────────────────────────────────────────────────────────────

function App() {
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "paper",
    "workflow": "greenfield",
    "accent": "#c8331d",
    "showGrain": true
  }/*EDITMODE-END*/;

  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply theme
  useEffect(() => {
    if (t.theme === "dark") document.documentElement.classList.add("dark");
    else document.documentElement.classList.remove("dark");
  }, [t.theme]);

  // Apply accent
  useEffect(() => {
    document.documentElement.style.setProperty("--accent", t.accent);
    // Derive a darker accent-ink
    document.documentElement.style.setProperty("--accent-ink", t.accent);
  }, [t.accent]);

  // Toggle grain
  useEffect(() => {
    const id = "grain-toggle-style";
    let el = document.getElementById(id);
    if (!el) {
      el = document.createElement("style");
      el.id = id;
      document.head.appendChild(el);
    }
    el.textContent = t.showGrain ? "" : "body::before { display: none !important; }";
  }, [t.showGrain]);

  return (
    <>
      <Masthead meta={COOKBOOK.meta} />
      <WorkflowSection />
      <PrinciplesSection />
      <WalkthroughSection workflow={t.workflow} setWorkflow={(v) => setTweak("workflow", v)} />
      <TDDLoopSection />
      <PodSection />
      <GatesSection />
      <ExtensionsSection />
      <FlywheelSection />
      <Stack2026Section />
      <Colophon />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme">
          <TweakRadio
            label="Mode"
            value={t.theme}
            onChange={(v) => setTweak("theme", v)}
            options={[
              { value: "paper", label: "Paper" },
              { value: "dark", label: "Dark" },
            ]}
          />
          <TweakColor
            label="Accent color"
            value={t.accent}
            onChange={(v) => setTweak("accent", v)}
            options={["#c8331d", "#2a4d7a", "#2d6a4f", "#b8860b", "#7a2e8c"]}
          />
          <TweakToggle
            label="Paper grain"
            value={t.showGrain}
            onChange={(v) => setTweak("showGrain", v)}
          />
        </TweakSection>
        <TweakSection label="Walkthrough">
          <TweakRadio
            label="Workflow path"
            value={t.workflow}
            onChange={(v) => setTweak("workflow", v)}
            options={[
              { value: "greenfield", label: "Greenfield" },
              { value: "brownfield", label: "Brownfield" },
              { value: "bugfix", label: "Bug fix" },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

</body>
