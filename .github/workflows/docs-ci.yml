name: Docs CI

on:
  push:
    branches: ["main", "improvements/**", "docs/**", "fix/**", "feat/**", "ci/**", "chore/**", "claude/**"]
  pull_request:
    branches: ["main"]

# Every tool below is pinned to an exact version. An unpinned `npm install -g`
# resolves @latest at run time, which means the same commit can pass today and
# fail tomorrow because someone else shipped a release. `check-toolchain` fails
# the build if a pin is ever dropped. Bump these deliberately, in their own PR.
env:
  MARKDOWNLINT_CLI_VERSION: "0.49.1"
  MARKDOWN_LINK_CHECK_VERSION: "3.15.0"
  CSPELL_VERSION: "10.2.0"
  # Node 20 reached end-of-life on 2026-04-30. The supported line is 22 (LTS
  # until 2027-04-30) and 24 (until 2028-04-30); package.json `engines` and
  # `.nvmrc` must agree, which `check-toolchain` enforces.
  NODE_DEFAULT: "24"

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@${{ env.MARKDOWNLINT_CLI_VERSION }}

      - name: Lint all markdown files
        run: markdownlint "**/*.md" --ignore node_modules --ignore ".specify/**" --ignore ".claude/**"

  link-check:
    name: Check Internal Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@${{ env.MARKDOWN_LINK_CHECK_VERSION }}

      - name: Check links in all markdown files
        run: |
          find . -name "*.md" \
            -not -path "./node_modules/*" \
            -not -path "./.specify/*" \
            -not -path "./.claude/*" \
            | xargs -I {} markdown-link-check {} \
              --config .github/mlc-config.json

  # The installers ship to macOS, Windows and Linux, and the docs give
  # per-platform commands. Prove the suite passes on all three rather than
  # assuming Linux behaviour generalises.
  unit-tests:
    name: Unit Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # No dependencies to install — the suite uses node:test, built into Node.
      - name: Run the test suite
        run: npm test

  # Guards the build environment itself: engines/.nvmrc/CI agreement, exact
  # version pins on the tools above, and docs that do not promise an older
  # Node than package.json supports.
  toolchain:
    name: Toolchain Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_DEFAULT }}

      - name: Check the Node baseline and CI tool pins
        run: npm run check:toolchain

  # The repo ships skills that other people install. If one of them drifts out
  # of the Agent Skills spec — or picks up a character a reviewer cannot see —
  # that ships to every reader. --strict so portability warnings block too:
  # a skill published here should work in every tool, not only in Claude Code.
  skills:
    name: Agent Skills Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_DEFAULT }}

      - name: Validate every SKILL.md this repo publishes
        run: npm run lint:skills

  # The eval-harness skill tells readers to copy templates/evals/ as their
  # starting point. An example that does not pass its own gate would teach the
  # wrong shape to everyone who copies it, so the example is checked here under
  # --strict — the same bar the skill asks readers to hold themselves to.
  evals:
    name: Eval Dataset Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_DEFAULT }}

      - name: Validate the example eval dataset
        run: npm run lint:evals

  build-explorer:
    name: Build Explorer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_DEFAULT }}

      - name: Rebuild the explorer bundle from design/src
        run: npm run build:explorer

      # Runs on Windows too: the build must be byte-identical there, which is
      # what `.gitattributes` (eol=lf) guarantees. If someone removes it, this
      # job is what catches the regression.
      - name: Fail if the committed bundle is out of date
        shell: bash
        run: |
          if ! git diff --exit-code -- design/cookbook-explorer.html; then
            echo "::error::design/cookbook-explorer.html is stale. Run 'npm run build:explorer' and commit the result."
            exit 1
          fi

  spell-check:
    name: Spell Check (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true  # Advisory only — does not block merge
    steps:
      - uses: actions/checkout@v7

      - name: Install cspell
        run: npm install -g cspell@${{ env.CSPELL_VERSION }}

      - name: Spell check markdown files
        run: cspell "**/*.md" --no-progress --config .github/cspell.json
